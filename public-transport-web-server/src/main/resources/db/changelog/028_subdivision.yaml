databaseChangeLog:
  - changeSet:
      id: init-subdivision
      author: pwrona
      changes:
        - createTable:
            tableName: subdivision
            columns:
              - column:
                  name: teryt
                  type: varchar(7)
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_subdivision
                    nullable: false
              - column:
                  name: geometry
                  type: text
                  constraints:
                    nullable: false

