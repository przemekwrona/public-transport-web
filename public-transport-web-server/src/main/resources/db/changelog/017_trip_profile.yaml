databaseChangeLog:
  - changeSet:
      id: create-trip-profile-table
      author: pwrona
      changes:
        - createSequence:
            sequenceName: trip_profile_id_seq
            startValue: 1
            incrementBy: 1

        - createTable:
            tableName: trip_profile
            columns:
              - column:
                  name: trip_profile_id
                  type: integer
                  defaultValueSequenceNext: trip_profile_id_seq
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_trip_profile
                    nullable: false
              - column:
                  name: trip_id
                  type: integer
                  constraints:
                    nullable: false
                    foreignKeyName: fk_trip_profile_trip
                    references: trip(trip_id)
                    deleteCascade: true
              - column:
                  name: traffic_mode
                  type: varchar(16)
                  constraints:
                    nullable: false
              - column:
                  name: travel_time_in_seconds
                  type: int
              - column:
                  name: calculated_communication_velocity
                  type: int
              - column:
                  name: customized_communication_velocity
                  type: int
              - column:
                  name: is_default
                  type: boolean
                  defaultValueBoolean: false
              - column:
                  name: is_customized
                  type: boolean
                  defaultValueBoolean: false

        - createIndex:
            indexName: idx_trip_profile_unique
            tableName: trip_profile
            unique: true
            columns:
              - column:
                  name: trip_id
              - column:
                  name: traffic_mode
      rollback:
        - dropTable:
            tableName: trip_profile
        - dropSequence:
            sequenceName: trip_profile_id_seq

  - changeSet:
      id: add-trip-profile-id-to-stop-time
      author: pwrona
      changes:
        - addColumn:
            tableName: stop_time
            columns:
              - column:
                  name: trip_profile_id
                  type: integer
                  constraints:
                    nullable: true
                    foreignKeyName: fk_stop_time_trip_profile
                    references: trip_profile(trip_profile_id)
      rollback:
        - dropColumn:
            tableName: stop_time
            columnName: trip_profile_id

  - changeSet:
      id: migrate-trip-into-trip-profile
      author: pwrona
      changes:
        - sql:
            sql: |
              INSERT INTO trip_profile (
                trip_id,
                traffic_mode,
                travel_time_in_seconds,
                calculated_communication_velocity,
                customized_communication_velocity,
                is_default,
                is_customized
              )
              SELECT
                t.trip_id,
                t.traffic_mode,
                t.travel_time_in_seconds,
                t.calculated_communication_velocity,
                t.customized_communication_velocity,
                CASE WHEN t.traffic_mode = 'NORMAL' THEN TRUE ELSE FALSE END,
                COALESCE(t.is_customized, FALSE)
              FROM trip t;
        - sql:
            sql: |
              UPDATE stop_time st
              SET trip_profile_id = tp.trip_profile_id
              FROM trip_profile tp
              WHERE st.trip_id = tp.trip_id;
      rollback:
        - sql:
            sql: UPDATE stop_time SET trip_profile_id = NULL;
        - sql:
            sql: DELETE FROM trip_profile;

  - changeSet:
      id: restructure-stop-time-for-trip-profile
      author: pwrona
      changes:
        - dropPrimaryKey:
            tableName: stop_time
            constraintName: pk_stop_time

        - dropForeignKeyConstraint:
            baseTableName: stop_time
            constraintName: fk_stop_time_trip

        - sql:
            sql: UPDATE stop_time SET trip_id = trip_profile_id;

        - dropForeignKeyConstraint:
            baseTableName: stop_time
            constraintName: fk_stop_time_trip_profile

        - dropColumn:
            tableName: stop_time
            columnName: trip_profile_id

        - renameColumn:
            tableName: stop_time
            oldColumnName: trip_id
            newColumnName: trip_profile_id
            columnDataType: integer

        - addNotNullConstraint:
            tableName: stop_time
            columnName: trip_profile_id
            columnDataType: integer

        - addForeignKeyConstraint:
            constraintName: fk_stop_time_trip_profile
            baseTableName: stop_time
            baseColumnNames: trip_profile_id
            referencedTableName: trip_profile
            referencedColumnNames: trip_profile_id
            onDelete: CASCADE

        - addPrimaryKey:
            tableName: stop_time
            columnNames: trip_profile_id, stop_sequence
            constraintName: pk_stop_time
      rollback:
        - dropPrimaryKey:
            tableName: stop_time
            constraintName: pk_stop_time

        - dropForeignKeyConstraint:
            baseTableName: stop_time
            constraintName: fk_stop_time_trip_profile

        - renameColumn:
            tableName: stop_time
            oldColumnName: trip_profile_id
            newColumnName: trip_id
            columnDataType: integer

        - addColumn:
            tableName: stop_time
            columns:
              - column:
                  name: trip_profile_id
                  type: integer
                  constraints:
                    nullable: true
                    foreignKeyName: fk_stop_time_trip_profile
                    references: trip_profile(trip_profile_id)

        - sql:
            sql: |
              UPDATE stop_time st
              SET trip_profile_id = tp.trip_profile_id
              FROM trip_profile tp
              WHERE st.trip_id = tp.trip_id;

        - addForeignKeyConstraint:
            constraintName: fk_stop_time_trip
            baseTableName: stop_time
            baseColumnNames: trip_id
            referencedTableName: trip
            referencedColumnNames: trip_id
            onDelete: CASCADE

        - addPrimaryKey:
            tableName: stop_time
            columnNames: trip_id, stop_sequence
            constraintName: pk_stop_time

  - changeSet:
      id: drop-trip-profile-columns-from-trip
      author: pwrona
      changes:
        - dropColumn:
            tableName: trip
            columnName: calculated_communication_velocity
        - dropColumn:
            tableName: trip
            columnName: customized_communication_velocity
        - dropColumn:
            tableName: trip
            columnName: is_customized
      rollback:
        - addColumn:
            tableName: trip
            columns:
              - column:
                  name: calculated_communication_velocity
                  type: int
              - column:
                  name: customized_communication_velocity
                  type: int
              - column:
                  name: is_customized
                  type: boolean
                  defaultValueBoolean: false
