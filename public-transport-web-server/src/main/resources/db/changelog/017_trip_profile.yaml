databaseChangeLog:
  - changeSet:
      id: create-trip-profile-table
      author: pwrona
      changes:
        - createSequence:
            sequenceName: trip_profile_id_seq
            startValue: 1
            incrementBy: 1

        - createTable:
            tableName: trip_profile
            columns:
              - column:
                  name: trip_profile_id
                  type: integer
                  defaultValueSequenceNext: trip_profile_id_seq
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_trip_profile
                    nullable: false
              - column:
                  name: trip_id
                  type: integer
                  constraints:
                    nullable: false
                    foreignKeyName: fk_trip_profile_trip
                    references: trip(trip_id)
                    deleteCascade: true
              - column:
                  name: traffic_mode
                  type: varchar(16)
                  constraints:
                    nullable: false
              - column:
                  name: travel_time_in_seconds
                  type: int
              - column:
                  name: calculated_communication_velocity
                  type: int
              - column:
                  name: customized_communication_velocity
                  type: int
              - column:
                  name: is_default
                  type: boolean
                  defaultValueBoolean: false
              - column:
                  name: is_customized
                  type: boolean
                  defaultValueBoolean: false

        - createIndex:
            indexName: idx_trip_profile_unique
            tableName: trip_profile
            unique: true
            columns:
              - column:
                  name: trip_id
              - column:
                  name: traffic_mode
      rollback:
        - dropTable:
            tableName: trip_profile
        - dropSequence:
            sequenceName: trip_profile_id_seq

  - changeSet:
      id: add-trip-profile-id-to-stop-time
      author: pwrona
      changes:
        - addColumn:
            tableName: stop_time
            columns:
              - column:
                  name: trip_profile_id
                  type: integer
                  constraints:
                    nullable: true
                    foreignKeyName: fk_stop_time_trip_profile
                    references: trip_profile(trip_profile_id)
      rollback:
        - dropColumn:
            tableName: stop_time
            columnName: trip_profile_id
