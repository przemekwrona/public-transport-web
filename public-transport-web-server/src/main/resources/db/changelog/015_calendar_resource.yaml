databaseChangeLog:
  - changeSet:
      id: create-table-brigade-item
      author: pwrona
      changes:
        - createSequence:
            sequenceName: brigade_item_id_seq
            startValue: 1
            incrementBy: 1

        - createTable:
            tableName: brigade_item
            columns:
              - column:
                  name: brigade_item_id
                  type: integer
                  defaultValueSequenceNext: brigade_item_id_seq
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_brigade_item
                    nullable: false
              - column:
                  name: calendar_item_id
                  type: integer
                  constraints:
                    nullable: false
                    foreignKeyName: fk_brigade_item_calendar_item
                    references: calendar_item(calendar_item_id)
              - column:
                  name: name
                  type: varchar(50)
                  constraints:
                    nullable: false
      rollback:
        - dropTable:
            tableName: brigade_item
        - dropSequence:
            sequenceName: brigade_item_id_seq

  - changeSet:
      id: create-brigade-item-sequence-table
      author: pwrona
      changes:
        - createTable:
            tableName: brigade_item_sequence
            columns:
              - column:
                  name: agency_code
                  type: varchar(15)
                  constraints:
                    nullable: false
              - column:
                  name: calendar_code
                  type: varchar(4)
                  constraints:
                    nullable: false
              - column:
                  name: next_value
                  type: BIGINT
                  defaultValueNumeric: 1
                  constraints:
                    nullable: false
        - addPrimaryKey:
            tableName: brigade_item_sequence
            columnNames: agency_code, calendar_code
            constraintName: pk_brigade_item_sequence
      rollback:
        - dropTable:
            tableName: brigade_item_sequence

  - changeSet:
      id: create-table-brigade-group
      author: pwrona
      changes:
        - createSequence:
            sequenceName: brigade_group_id_seq
            startValue: 1
            incrementBy: 1

        - createTable:
            tableName: brigade_group
            columns:
              - column:
                  name: brigade_group_id
                  type: integer
                  defaultValueSequenceNext: brigade_group_id_seq
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_brigade_group
                    nullable: false
              - column:
                  name: brigade_item_id
                  type: integer
                  constraints:
                    nullable: false
                    foreignKeyName: fk_brigade_group_brigade_item
                    references: brigade_item(brigade_item_id)
              - column:
                  name: calendar_symbol_id
                  type: integer
                  constraints:
                    nullable: false
                    foreignKeyName: fk_brigade_group_calendar_symbol
                    references: calendar_symbol(calendar_symbol_id)
              - column:
                  name: name
                  type: varchar(50)
                  constraints:
                    nullable: false

  - changeSet:
      id: create-table-brigade-resource
      author: pwrona
      changes:
        - createSequence:
            sequenceName: brigade_resource_id_seq
            startValue: 1
            incrementBy: 1

        - createTable:
            tableName: brigade_resource
            columns:
              - column:
                  name: brigade_resource_id
                  type: integer
                  defaultValueSequenceNext: brigade_resource_id_seq
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_brigade_resource
                    nullable: false
              - column:
                  name: brigade_group_id
                  type: integer
                  constraints:
                    nullable: false
                    foreignKeyName: fk_brigade_resource_brigade_group
                    references: brigade_group(brigade_group_id)
              - column:
                  name: sequence
                  type: int
                  constraints:
                    nullable: false
              - column:
                  name: sequence_hex
                  type: varchar(4)
                  constraints:
                    nullable: false
              - column:
                  name: creation_date
                  type: timestamp
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false

  - changeSet:
      id: create-brigade-resource-sequences-table
      author: pwrona
      changes:
        - createTable:
            tableName: brigade_resource_sequences
            columns:
              - column:
                  name: agency_code
                  type: varchar(15)
                  constraints:
                    nullable: false
              - column:
                  name: brigade_item_sequence
                  type: int
                  constraints:
                    nullable: false
              - column:
                  name: calendar_item_sequence
                  type: int
                  constraints:
                    nullable: false
              - column:
                  name: calendar_symbol
                  type: varchar(4)
                  constraints:
                    nullable: false
              - column:
                  name: next_value
                  type: BIGINT
                  defaultValueNumeric: 1
                  constraints:
                    nullable: false
        - addPrimaryKey:
            tableName: brigade_resource_sequences
            columnNames: agency_code, brigade_item_sequence, calendar_item_sequence, calendar_symbol
            constraintName: pk_brigade_resource_sequences
      rollback:
        - dropTable:
            tableName: brigade_resource_sequences

  - changeSet:
      id: create-table-brigade-event
      author: pwrona
      changes:
        - createSequence:
            sequenceName: brigade_event_id_seq
            startValue: 1
            incrementBy: 1

        - createTable:
            tableName: brigade_event
            columns:
              - column:
                  name: brigade_event_id
                  type: integer
                  defaultValueSequenceNext: brigade_event_id_seq
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_brigade_event
                    nullable: false
              - column:
                  name: start_second
                  type: int
                  constraints:
                    nullable: false
              - column:
                  name: end_second
                  type: int
                  constraints:
                    nullable: false
              - column:
                  name: resource_id
                  type: integer
                  constraints:
                    nullable: false
                    foreignKeyName: fk_brigade_event_brigade_resource
                    references: brigade_resource(brigade_resource_id)
              - column:
                  name: line
                  type: varchar(10)
                  constraints:
                    nullable: false
              - column:
                  name: name
                  type: varchar(255)
                  constraints:
                    nullable: false
              - column:
                  name: sequence
                  type: int
                  constraints:
                    nullable: false
              - column:
                  name: sequence_hex
                  type: varchar(4)
                  constraints:
                    nullable: false
      rollback:
        - dropTable:
            tableName: brigade_event
        - dropSequence:
            sequenceName: brigade_event_id_seq

  - changeSet:
      id: create-brigade-event-sequence-table
      author: pwrona
      changes:
        - createTable:
            tableName: brigade_event_sequence
            columns:
              - column:
                  name: agency_code
                  type: varchar(15)
                  constraints:
                    nullable: false
              - column:
                  name: brigade_item_sequence
                  type: int
                  constraints:
                    nullable: false
              - column:
                  name: calendar_code
                  type: varchar(4)
                  constraints:
                    nullable: false
              - column:
                  name: calendar_symbol
                  type: varchar(4)
                  constraints:
                    nullable: false
              - column:
                  name: next_value
                  type: BIGINT
                  defaultValueNumeric: 1
                  constraints:
                    nullable: false
        - addPrimaryKey:
            tableName: brigade_event_sequence
            columnNames: agency_code, brigade_item_sequence, calendar_code, calendar_symbol
            constraintName: pk_brigade_event_sequence
      rollback:
        - dropTable:
            tableName: brigade_event_sequence
