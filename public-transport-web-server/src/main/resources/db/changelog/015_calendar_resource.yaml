databaseChangeLog:
  - changeSet:
      id: create-table-brigade-group
      author: pwrona
      changes:
        - createSequence:
            sequenceName: brigade_group_id_seq
            startValue: 1
            incrementBy: 1

        - createTable:
            tableName: brigade_group
            columns:
              - column:
                  name: brigade_group_id
                  type: integer
                  defaultValueSequenceNext: brigade_group_id_seq
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_brigade_group
                    nullable: false
              - column:
                  name: calendar_symbol_id
                  type: integer
                  constraints:
                    nullable: false
                    foreignKeyName: fk_brigade_group_calendar_symbol
                    references: calendar_symbol(calendar_symbol_id)
              - column:
                  name: name
                  type: varchar(50)
                  constraints:
                    nullable: false

  - changeSet:
      id: create-table-brigade-resource
      author: pwrona
      changes:
        - createSequence:
            sequenceName: brigade_resource_id_seq
            startValue: 1
            incrementBy: 1

        - createTable:
            tableName: brigade_resource
            columns:
              - column:
                  name: brigade_resource_id
                  type: integer
                  defaultValueSequenceNext: brigade_resource_id_seq
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_brigade_resource
                    nullable: false
              - column:
                  name: brigade_group_id
                  type: integer
                  constraints:
                    nullable: false
                    foreignKeyName: fk_brigade_resource_brigade_group
                    references: brigade_group(brigade_group_id)
              - column:
                  name: sequence
                  type: int
                  constraints:
                    nullable: false
              - column:
                  name: sequence_hex
                  type: varchar(4)
                  constraints:
                    nullable: false
              - column:
                  name: creation_date
                  type: timestamp
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false

  - changeSet:
      id: create-brigade-resource-sequences-table
      author: pwrona
      changes:
        - createTable:
            tableName: brigade_resource_sequences
            columns:
              - column:
                  name: agency_code
                  type: varchar(15)
                  constraints:
                    nullable: false
              - column:
                  name: calendar_item_sequence
                  type: int
                  constraints:
                    nullable: false
              - column:
                  name: calendar_symbol
                  type: varchar(4)
                  constraints:
                    nullable: false
              - column:
                  name: next_value
                  type: BIGINT
                  defaultValueNumeric: 1
                  constraints:
                    nullable: false
        - addPrimaryKey:
            tableName: brigade_resource_sequences
            columnNames: agency_code, calendar_item_sequence, calendar_symbol
            constraintName: pk_brigade_resource_sequences
      rollback:
        - dropTable:
            tableName: brigade_resource_sequences
