databaseChangeLog:
  - changeSet:
      id: rename-super-user-role
      author: pwrona
      changes:
        - sql:
            sql: |
              INSERT INTO app_role (app_role_id, description)
              SELECT 'super_user', description
              FROM app_role
              WHERE app_role_id = 'SUPER_USER'
                AND NOT EXISTS (SELECT 1 FROM app_role WHERE app_role_id = 'super_user');
              UPDATE app_user_app_role SET app_role_id = 'super_user' WHERE app_role_id = 'SUPER_USER';
              DELETE FROM app_role WHERE app_role_id = 'SUPER_USER';
