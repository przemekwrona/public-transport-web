<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pl">
<head>
    <meta charset="UTF-8"/>
    <title>Witamy w Następna Stacja</title>
</head>
<body style="margin:0;padding:0;background:#f4f6f8;font-family:Arial,sans-serif;color:#1f2933;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f4f6f8;padding:24px 0;">
    <tr>
        <td align="center">
            <table role="presentation" width="560" cellpadding="0" cellspacing="0" style="max-width:560px;background:#ffffff;border-radius:8px;">
                <tr>
                    <td style="padding:28px 32px 8px 32px;">
                        <img src="cid:logo" alt="Następna Stacja" width="85" height="60" style="display:block;border:0;"/>
                    </td>
                </tr>
                <tr>
                    <td style="padding:8px 32px 0 32px;font-size:16px;line-height:1.5;">
                        Konto jest gotowe. Możesz się zalogować.
                    </td>
                </tr>
                <tr>
                    <td style="padding:16px 32px 0 32px;font-size:15px;line-height:1.5;">
                        Login: <strong th:text="${username}">jan</strong>
                    </td>
                </tr>
                <tr>
                    <td style="padding:8px 32px 0 32px;font-size:15px;line-height:1.5;">
                        Hasło zostało ustawione przy zakładaniu konta. Ta wiadomość go nie zawiera.
                    </td>
                </tr>
                <tr>
                    <td style="padding:24px 32px;">
                        <a th:href="${loginUrl}"
                           href="http://localhost:4200/#/signin"
                           style="display:inline-block;background:#1f6feb;color:#ffffff;text-decoration:none;padding:12px 20px;border-radius:6px;font-size:15px;">
                            Zaloguj się
                        </a>
                    </td>
                </tr>
                <tr>
                    <td style="padding:0 32px 28px 32px;font-size:13px;line-height:1.5;color:#52606d;">
                        Jeśli nie spodziewałeś się tej wiadomości, zignoruj ją.
                    </td>
                </tr>
            </table>
        </td>
    </tr>
</table>
</body>
</html>
