spring.application.name=insurance_app
spring.servlet.multipart.max-file-size=2MB
webserver.context.path=/api/v1
server.port=8080

spring.datasource.url=jdbc:postgresql://localhost:5432/public_transport_db
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.yaml
spring.liquibase.default-schema=public_transport
spring.liquibase.liquibase-schema=public_transport

# Ensures Hibernate doesn't try to be "too smart" with ID generation
spring.jpa.properties.hibernate.id.db_structure_naming_strategy=single
spring.jpa.properties.hibernate.default_schema=public_transport
#spring.jpa.show-sql=true

# issuer-uri is the address written into the token. jwk-set-uri is the address this process can call.
spring.security.oauth2.resourceserver.jwt.issuer-uri=${KEYCLOAK_ISSUER_URI:http://localhost:8081/realms/public-transport}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${KEYCLOAK_JWK_SET_URI:http://localhost:8081/realms/public-transport/protocol/openid-connect/certs}

keycloak.client-id=${KEYCLOAK_CLIENT_ID:public-transport-web}
keycloak.client-secret=${KEYCLOAK_CLIENT_SECRET:public-transport-web-secret}
# Service account used only to create users. It cannot log a person in.
keycloak.provisioning-client-id=${KEYCLOAK_PROVISIONING_CLIENT_ID:public-transport-provisioning}
keycloak.provisioning-client-secret=${KEYCLOAK_PROVISIONING_CLIENT_SECRET:public-transport-provisioning-secret}

management.endpoints.web.exposure.include=*

logging.level.pl.wrona.webserver.client.geoapify.GeoapifyClient=DEBUG
#logging.level.pl.wrona.webserver.gbfs.GbfsNextBikeClient=DEBUG

otp.client.warsaw.name=warsaw-otp-client
otp.client.warsaw.url=http://localhost:8082

gbfs.client.warsaw.name=warsaw-gbfs-client
gbfs.client.warsaw.url=https://gbfs.nextbike.net/maps/gbfs

gtfs.server.warsaw.url=http://localhost:8083/api/

weather.client.name=weather-client
weather.client.url=http://api.weatherapi.com
weather.client.key=05a9874c813049f5bb4174704241210

geoapify.client.name=geoapify-client
geoapify.client.url=https://api.geoapify.com
geoapify.client.key=${GHA_SECRET_GEOAPIFY_API_KEY}
