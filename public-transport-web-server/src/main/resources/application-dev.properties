spring.datasource.url=jdbc:postgresql://public-transport-db:5432/public_transport_db
spring.datasource.username=${GHA_SECRET_DB_USERNAME}
spring.datasource.password=${GHA_SECRET_DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

keycloak.server-url=http://keycloak:8080
keycloak.issuer-uri=http://localhost:8081/realms/public-transport
keycloak.jwk-set-uri=http://keycloak:8080/realms/public-transport/protocol/openid-connect/certs
