openapi: 3.0.0
info:

paths:
  /agency/{agency}/calendar-item:
    get:
      tags:
        - calendar
      summary: Return active calendars items and theirs symbols
      operationId: getCalendarItems
      parameters:
        - in: path
          name: agency
          required: true
          schema:
            type: string
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetCalendarItemResponse'

  /agency/{agency}/calendar-item/{calendarCode}/calendar-symbol:
    get:
      tags:
        - calendar-symbol
      summary: Return calendars symbols by calendarCode
      operationId: getCalendarSymbolsByCalendarCode
      parameters:
        - in: path
          name: agency
          required: true
          schema:
            type: string
        - in: path
          name: calendarCode
          required: true
          schema:
            type: string
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetCalendarSymbolsResponse'

  /agency/{agency}/calendar-item/{calendarCode}/calendar-symbol/{calendarSymbol}:
    get:
      tags:
        - calendar
      summary: Return active calendars
      operationId: getCalendarSymbol
      parameters:
        - in: path
          name: agency
          required: true
          schema:
            type: string
        - in: path
          name: calendarCode
          required: true
          schema:
            type: string
        - in: path
          name: calendarSymbol
          required: true
          schema:
            type: string
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CalendarSymbolBody'

    delete:
      tags:
        - calendar
      summary: Delete calendar by calendarName and symbol
      operationId: deleteCalendarByCalendarNameAndSymbol
      parameters:
        - in: path
          name: agency
          required: true
          schema:
            type: string
        - in: path
          name: calendarCode
          required: true
          schema:
            type: string
        - in: path
          name: calendarSymbol
          required: true
          schema:
            type: string
      responses:
        204:
          description: Deleted
          content:
            application/json:
              schema:
                $ref: '../public-transport-api.yaml/#/components/schemas/Status'

components:
  schemas:

    CalendarItemBody:
      type: object
      properties:
        calendarItemId:
          $ref: '../public-transport-core.yaml/#/components/schemas/CalendarItemId'
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date
        calendarName:
          type: string
        symbols:
          type: array
          items:
            $ref: '#/components/schemas/CalendarSymbolBody'

    GetCalendarItemResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/CalendarItemBody'

    GetCalendarSymbolsResponse:
      type: object
      properties:
        calendars:
          type: array
          items:
            $ref: '#/components/schemas/CalendarSymbolBody'

    CalendarSymbolBody:
      type: object
      properties:
        calendarSymbolId:
          $ref: '../public-transport-core.yaml/#/components/schemas/CalendarSymbolId'
        calendarName:
          type: string
        description:
          type: string
        designation:
          type: string
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date
        monday:
          type: boolean
        tuesday:
          type: boolean
        wednesday:
          type: boolean
        thursday:
          type: boolean
        friday:
          type: boolean
        saturday:
          type: boolean
        sunday:
          type: boolean
        included:
          type: array
          items:
            type: string
            format: date
        excluded:
          type: array
          items:
            type: string
            format: date




  
