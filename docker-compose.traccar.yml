services:

  database:
    image: timescale/timescaledb:latest-pg17
    restart: unless-stopped
    mem_limit: 512m
    environment:
      POSTGRES_DB: traccar_db
      POSTGRES_USER: user
      POSTGRES_PASSWORD: welcome1
    volumes:
      - ./data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB" ]
      interval: 10s
      timeout: 5s
      retries: 5

  traccar:
    image: traccar/traccar:latest
    restart: unless-stopped
    mem_limit: 800m
    depends_on:
      database:
        condition: service_healthy
    environment:
      CONFIG_USE_ENVIRONMENT_VARIABLES: "true"
      # keep the JVM heap well below mem_limit (image default is -Xmx1g)
      JAVA_OPTS: "-Xms256m -Xmx512m"
      DATABASE_DRIVER: org.postgresql.Driver
      DATABASE_URL: jdbc:postgresql://database:5432/traccar_db
      DATABASE_USER: user
      DATABASE_PASSWORD: welcome1
    healthcheck:
      test: [ "CMD", "wget", "-q", "--spider", "http://localhost:8082/api/health" ]
      interval: 2m
      timeout: 5s
      start_period: 1h
      retries: 3
    ports:
      - "8082:8082"
      # device protocol port (5055 = Traccar Client / OsmAnd); add others as needed
      - "5055:5055"
    volumes:
      - ./logs:/opt/traccar/logs

  nginx:
    image: nginx:alpine
    container_name: nginx-proxy
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/www/certbot:/var/www/certbot:ro
    depends_on:
      - public-transport-app

