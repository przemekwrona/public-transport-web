<div class="grid lg:grid-cols-2 grow h-full">
    <div class="flex justify-center items-center p-8 lg:p-10 order-2 lg:order-1">
        <div class="max-w-[400px] w-full">
            <form class="card-body flex flex-col gap-5" id="sign_in_form" (submit)="$event.preventDefault()">
                <div class="text-center mb-2.5">
                    <h3 transloco="signin.header" class="text-lg font-medium text-gray-900 leading-none mb-2.5">Logowanie do Systemu</h3>
                    <div class="flex items-center justify-center font-medium">
                        <a class="text-2sm link" [routerLink]="['/company']" transloco="signin.undo">Wróć na stronę główną</a>
                    </div>
                </div>
                <div class="flex items-center justify-between gap-1">
                    <span transloco="signin.notification.lack-of-account" class="badge badge-sm badge-outline badge-info w-full">
                        Nie masz konta? Skontaktuj się z zespołem Następna Stacja mailowo w celu jego założenia. Napisz na adres biuro&#64;nastepnastacja.pl
                    </span>
                </div>
                @if (loginFailed) {
                    <span class="badge badge-sm badge-outline badge-danger w-full">
                        Nie udało się otworzyć logowania Keycloak.
                    </span>
                }
                <button transloco="signin.login.button" type="button" (click)="login()" class="btn btn-primary flex justify-center grow">
                    Zaloguj się
                </button>
            </form>
        </div>
    </div>
    <div class="lg:border-gray-200 order-1 lg:order-2 bg-top xxl:bg-center xl:bg-cover bg-no-repeat branded-bg">
        <div class="flex flex-col p-8 lg:p-16 gap-4"></div>
    </div>
</div>
