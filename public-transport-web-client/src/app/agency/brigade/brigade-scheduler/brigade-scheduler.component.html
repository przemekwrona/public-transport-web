<div class="flex flex-wrap items-center lg:items-end justify-between gap-5 pb-7.5">
    <div class="flex flex-col justify-center gap-2">
        <h3 class="text-xl font-medium leading-none text-gray-900">Symbol #{{ brigadeBody.calendarDesignation }}</h3>
        <div class="flex items-center gap-2 text-sm font-normal text-gray-700">
            {{ brigadeBody.calendarDescription }}
        </div>
    </div>
    <div class="flex items-center gap-2">
        <button 
            type="button" 
            (click)="clearGroup()" 
            class="btn btn-sm btn-icon btn-clear btn-danger border border-red-500 border-w-s"
            aria-label="Wyczyść">
            <mat-icon class="font-sm">delete</mat-icon>
        </button>

        <div class="relative">
            <button type="button" (click)="toggleAlignAccordion()" class="btn btn-sm btn-secondary">
                <mat-icon class="me-1 font-sm">access_time</mat-icon>

                @if (selectedAlignMinutes) {
                    <span class="badge badge-sm badge-outline badge-primary">{{ alignLabel(selectedAlignMinutes) }}</span>
                }
                <i class="ki-filled ki-down text-xs ms-1 transition-transform duration-200"
                   [class.rotate-180]="alignAccordionOpen"></i>
            </button>
            @if (alignAccordionOpen) {
                <div class="absolute end-0 top-full z-20 mt-1 rounded-lg border border-gray-200 bg-white p-1 shadow-md">
                    <div class="btn-group">
                        @for (option of alignOptions; track option.minutes) {
                            <button type="button"
                                    (click)="alignToMinutes(option.minutes)"
                                    class="btn btn-xs"
                                    [class.btn-primary]="selectedAlignMinutes === option.minutes"
                                    [class.btn-secondary]="selectedAlignMinutes !== option.minutes">
                                {{ option.label }}
                            </button>
                        }
                    </div>
                </div>
            }
        </div>
        <button type="button"
                (click)="openTimetableModal()"
                class="btn btn-sm btn-icon btn-secondary"
                aria-label="Pokaż rozkład">
            <mat-icon class="font-sm">calendar_month</mat-icon>
        </button>
        <button type="button"
                (click)="openCreateEventPanel()"
                class="btn btn-sm btn-icon btn-secondary"
                aria-label="Dodaj kurs">
            <mat-icon class="font-sm">add</mat-icon>
        </button>
        <button type="button"
                class="btn btn-sm btn-icon btn-secondary"
                aria-label="Generator danych">
            <mat-icon class="font-sm">auto_fix_high</mat-icon>
        </button>
    </div>
</div>

<daypilot-scheduler
        [config]="config"
        [events]="events"
        #scheduler>
</daypilot-scheduler>

<button (click)="addResource()" class="btn btn-sm btn-primary w-full my-2 justify-center">Dodaj Kolejną Brygadę</button>
