<div class="flex flex-wrap items-center lg:items-end justify-between gap-5 pb-4">
    <div class="flex flex-col justify-center gap-2">
        <h3 class="text-xl font-medium leading-none text-gray-900">Symbol #{{ brigadeBody.calendarDesignation }}</h3>
        <div class="flex items-center gap-2 text-sm font-normal text-gray-700">
            {{ brigadeBody.calendarDescription }}
        </div>
    </div>
</div>

<div class="brigade-ribbon" role="toolbar" aria-label="Wstążka harmonogramu brygad">
    <div class="brigade-ribbon__tabs">
        <span class="brigade-ribbon__tab is-active">Brygady</span>
    </div>

    <div class="brigade-ribbon__body">
        <div class="brigade-ribbon__group">
            <div class="brigade-ribbon__commands">
                <button type="button"
                        class="brigade-ribbon__cmd brigade-ribbon__cmd--large"
                        (click)="openCreateEventPanel()"
                        title="Dodaj kurs do ostatniej brygady">
                    <mat-icon>add</mat-icon>
                    <span>Dodaj<br>kurs</span>
                </button>
            </div>
            <div class="brigade-ribbon__label">Kursy</div>
        </div>

        <div class="brigade-ribbon__divider" aria-hidden="true"></div>

        <div class="brigade-ribbon__group">
            <div class="brigade-ribbon__commands">
                <button type="button"
                        class="brigade-ribbon__cmd brigade-ribbon__cmd--large"
                        (click)="addResource()"
                        title="Dodaj kolejną brygadę">
                    <mat-icon>directions_bus</mat-icon>
                    <span>Dodaj<br>brygadę</span>
                </button>
            </div>
            <div class="brigade-ribbon__label">Harmonogram</div>
        </div>

        <div class="brigade-ribbon__divider" aria-hidden="true"></div>

        <div class="brigade-ribbon__group">
            <div class="brigade-ribbon__align">
                @for (option of alignOptions; track option.minutes) {
                    <button type="button"
                            class="brigade-ribbon__align-btn"
                            [class.is-active]="selectedAlignMinutes === option.minutes"
                            (click)="alignToMinutes(option.minutes)"
                            [title]="'Wyrównaj odjazdy do ' + option.label">
                        {{ option.label }}
                    </button>
                }
            </div>
            <div class="brigade-ribbon__label">Wyrównanie</div>
        </div>

        <div class="brigade-ribbon__divider" aria-hidden="true"></div>

        <div class="brigade-ribbon__group">
            <div class="brigade-ribbon__commands">
                <button type="button"
                        class="brigade-ribbon__cmd brigade-ribbon__cmd--large brigade-ribbon__cmd--danger"
                        (click)="clearGroup()"
                        title="Wyczyść wszystkie brygady w tym symbolu">
                    <mat-icon>delete</mat-icon>
                    <span>Wyczyść</span>
                </button>
            </div>
            <div class="brigade-ribbon__label">Zarządzanie</div>
        </div>

        <div class="brigade-ribbon__divider" aria-hidden="true"></div>

        <div class="brigade-ribbon__group">
            <div class="brigade-ribbon__commands">
                <button type="button"
                        class="brigade-ribbon__cmd brigade-ribbon__cmd--large"
                        (click)="openTimetableModal()"
                        title="Pokaż rozkład jazdy">
                    <mat-icon>calendar_month</mat-icon>
                    <span>Pokaż<br>rozkład</span>
                </button>
            </div>
            <div class="brigade-ribbon__label">Rozkład</div>
        </div>

        <div class="brigade-ribbon__divider" aria-hidden="true"></div>

        <div class="brigade-ribbon__group">
            <div class="brigade-ribbon__commands">
                <a [routerLink]="['/agency/brigades', brigadeCode, 'symbol', brigadeBody.calendarSymbolId.symbol, 'timetable']"
                   class="brigade-ribbon__cmd brigade-ribbon__cmd--large"
                   title="Generator danych rozkładu">
                    <mat-icon>auto_fix_high</mat-icon>
                    <span>Generator<br>danych</span>
                </a>
            </div>
            <div class="brigade-ribbon__label">Dane</div>
        </div>

        <div class="brigade-ribbon__divider" aria-hidden="true"></div>

        <div class="brigade-ribbon__group">
            <div class="brigade-ribbon__commands">
                <button type="button"
                        class="brigade-ribbon__cmd brigade-ribbon__cmd--large brigade-ribbon__cmd--ai"
                        (click)="optimizeBrigades()"
                        [disabled]="isOptimizing"
                        [class.is-optimizing]="isOptimizing"
                        title="Optymalizuj przydział brygad">
                    <mat-icon>auto_awesome</mat-icon>
                    <span>{{ isOptimizing ? 'Trwa…' : 'Optymalizuj' }}</span>
                </button>
            </div>
            <div class="brigade-ribbon__label">Optymalizacja</div>
        </div>
    </div>
</div>

<daypilot-scheduler
        [config]="config"
        [events]="events"
        #scheduler>
</daypilot-scheduler>

<button (click)="addResource()" class="btn btn-sm btn-primary w-full my-2 justify-center">Dodaj Kolejną Brygadę</button>
