<div class="container-fixed">
    <div class="flex flex-wrap items-center lg:items-end justify-between gap-5 pb-7.5">
        <div class="flex flex-col justify-center gap-2">
            <h1 class="text-xl font-medium leading-none text-gray-900">
                Linia {{ trips?.route?.routeId?.line || '' }} {{ trips?.route?.routeId?.name || '' }}
                <span class="badge badge-sm badge-outline badge-info">v{{ trips?.route?.routeId?.version }}.0</span>
            </h1>
            <div class="flex items-center gap-2 text-sm font-normal text-gray-700">
                Konfiguracja lini autobusowej
            </div>
        </div>
        <div class="flex items-center gap-2.5">
            <a [routerLink]="['/agency/routes']" class="btn btn-sm btn-secondary">Wróć do listy linii</a>
        </div>
    </div>

    <nav mat-tab-nav-bar [tabPanel]="tabPanel" class="mb-5">
        @for (tab of tabs; track tab.path) {
            <a mat-tab-link
               [routerLink]="tab.path"
               routerLinkActive
               #rla="routerLinkActive"
               [active]="rla.isActive"
               [routerLinkActiveOptions]="{exact: true}">
                {{ tab.label }}
            </a>
        }
    </nav>
    <mat-tab-nav-panel #tabPanel>
        <router-outlet></router-outlet>
    </mat-tab-nav-panel>
</div>
