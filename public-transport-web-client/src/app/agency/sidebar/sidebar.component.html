@if (sidebar.mobile() && sidebar.open()) {
    <p-sidebar-backdrop/>
}

<p-sidebar id="agency"
           [open]="sidebar.open()"
           (openChange)="onOpenChange($event)"
           [collapsible]="sidebar.mobile() ? 'offcanvas' : 'icon'"
           [overlay]="sidebar.mobile()"
           width="17.5rem"
           iconWidth="5rem">
    <p-sidebar-spacer/>
    <p-sidebar-aside>
        <p-sidebar-panel>
            <p-sidebar-header>
                <p-sidebar-menu>
                    <p-sidebar-menu-item>
                        <a routerLink="/agency/profile" pSidebarMenuButton
                           routerLinkActive [isActive]="brandLink.isActive" #brandLink="routerLinkActive">
                            <span class="agency-nav-mark">NS</span>
                            <span>NASTĘPNA STACJA</span>
                        </a>
                    </p-sidebar-menu-item>
                </p-sidebar-menu>
            </p-sidebar-header>
            <p-sidebar-content>
                @if (isAdmin()) {
                    <p-sidebar-group>
                        <p-sidebar-group-label>{{ getAgencyName() }}</p-sidebar-group-label>
                        <p-sidebar-group-content>
                            <p-sidebar-menu>
                                <p-sidebar-menu-item>
                                    <a routerLink="/admin/agency/profiles" pSidebarMenuButton
                                       routerLinkActive [isActive]="agenciesLink.isActive"
                                       #agenciesLink="routerLinkActive">
                                        <svg data-p-icon="building"></svg>
                                        <span>Lista Agencji</span>
                                    </a>
                                    <p-sidebar-menu-badge>Admin</p-sidebar-menu-badge>
                                </p-sidebar-menu-item>
                                <p-sidebar-menu-item>
                                    <a routerLink="/admin/users" pSidebarMenuButton
                                       routerLinkActive [isActive]="usersLink.isActive" #usersLink="routerLinkActive">
                                        <svg data-p-icon="users"></svg>
                                        <span>Użytkownicy</span>
                                    </a>
                                    <p-sidebar-menu-badge>Admin</p-sidebar-menu-badge>
                                </p-sidebar-menu-item>
                            </p-sidebar-menu>
                        </p-sidebar-group-content>
                    </p-sidebar-group>
                }

                <p-sidebar-group>
                    <p-sidebar-group-label>Agencja</p-sidebar-group-label>
                    <p-sidebar-group-content>
                        <p-sidebar-menu>
                            <p-sidebar-menu-item>
                                <a routerLink="/agency/profile" pSidebarMenuButton
                                   routerLinkActive [isActive]="profileLink.isActive" #profileLink="routerLinkActive">
                                    <svg data-p-icon="user"></svg>
                                    <span>Moja Firma</span>
                                </a>
                            </p-sidebar-menu-item>
                        </p-sidebar-menu>
                    </p-sidebar-group-content>
                </p-sidebar-group>

                <p-sidebar-group>
                    <p-sidebar-group-label>Użytkownik</p-sidebar-group-label>
                    <p-sidebar-group-content>
                        <p-sidebar-menu>
                            <p-sidebar-menu-item>
                                <a routerLink="/agency/account" pSidebarMenuButton
                                   routerLinkActive [isActive]="accountLink.isActive" #accountLink="routerLinkActive">
                                    <svg data-p-icon="user"></svg>
                                    <span>Moje Konto</span>
                                </a>
                            </p-sidebar-menu-item>
                        </p-sidebar-menu>
                    </p-sidebar-group-content>
                </p-sidebar-group>

                <p-sidebar-group>
                    <p-sidebar-group-label>Baza Danych</p-sidebar-group-label>
                    <p-sidebar-group-content>
                        <p-sidebar-menu>
                            <p-sidebar-menu-item>
                                <a routerLink="/agency/stops" pSidebarMenuButton
                                   routerLinkActive [routerLinkActiveOptions]="{exact: true}"
                                   [isActive]="stopsLink.isActive" #stopsLink="routerLinkActive">
                                    <svg data-p-icon="map"></svg>
                                    <span>Wszyskie Przystanki</span>
                                </a>
                            </p-sidebar-menu-item>
                        </p-sidebar-menu>
                    </p-sidebar-group-content>
                </p-sidebar-group>

                <p-sidebar-group>
                    <p-sidebar-group-label>Rozkład Jazdy</p-sidebar-group-label>
                    <p-sidebar-group-content>
                        <p-sidebar-menu>
                            <p-sidebar-menu-item>
                                <a routerLink="/agency/stops/used" pSidebarMenuButton
                                   routerLinkActive [isActive]="usedStopsLink.isActive"
                                   #usedStopsLink="routerLinkActive">
                                    <svg data-p-icon="map"></svg>
                                    <span>Moje Przystanki</span>
                                </a>
                            </p-sidebar-menu-item>
                            <p-sidebar-menu-item>
                                <a routerLink="/agency/routes" pSidebarMenuButton data-testid="line"
                                   routerLinkActive [isActive]="linesLink.isActive" #linesLink="routerLinkActive">
                                    <svg data-p-icon="directions"></svg>
                                    <span>Linie</span>
                                </a>
                            </p-sidebar-menu-item>
                            <p-sidebar-menu-item>
                                <a routerLink="/agency/calendars" pSidebarMenuButton
                                   routerLinkActive [isActive]="calendarsLink.isActive"
                                   #calendarsLink="routerLinkActive">
                                    <svg data-p-icon="calendar"></svg>
                                    <span>Kalendarz</span>
                                </a>
                            </p-sidebar-menu-item>
                            <p-sidebar-menu-item>
                                <a routerLink="/agency/brigades" pSidebarMenuButton
                                   routerLinkActive [isActive]="brigadesLink.isActive" #brigadesLink="routerLinkActive">
                                    <svg data-p-icon="clipboard"></svg>
                                    <span>Brygady</span>
                                </a>
                            </p-sidebar-menu-item>
                        </p-sidebar-menu>
                    </p-sidebar-group-content>
                </p-sidebar-group>

                <p-sidebar-group>
                    <p-sidebar-group-label>Dane</p-sidebar-group-label>
                    <p-sidebar-group-content>
                        <p-sidebar-menu>
                            <p-sidebar-menu-item>
                                <a routerLink="/agency/google/maps" pSidebarMenuButton
                                   routerLinkActive [isActive]="mapsLink.isActive" #mapsLink="routerLinkActive">
                                    <svg data-p-icon="google"></svg>
                                    <span>Mapy Google</span>
                                </a>
                            </p-sidebar-menu-item>
                        </p-sidebar-menu>
                    </p-sidebar-group-content>
                </p-sidebar-group>
            </p-sidebar-content>
            <button type="button" pSidebarRail
                    [attr.aria-label]="(sidebar.open() ? 'sidebar.collapse' : 'sidebar.expand') | transloco"></button>
        </p-sidebar-panel>
    </p-sidebar-aside>
</p-sidebar>
