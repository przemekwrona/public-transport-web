services:
  public-transport-db:
    image: postgres:18.6-alpine
    container_name: public-transport-db
    ports:
      - '5432:5432'
    environment:
      POSTGRES_DB: public_transport_db
      POSTGRES_USER: user
      POSTGRES_PASSWORD: welcome1

  public-transport-app:
#    build:
#      context: ./public-transport-web-server
#      dockerfile: Dockerfile
    image: registry.digitalocean.com/public-transport-registry/public-transport-web:latest
    container_name: public-transport-app
    ports:
      - '8080:8080'
    environment:
      PROFILE: dev
      JAVA_OPTS: -Xmx512m -Xms256m
      SPRING_DATASOURCE_USERNAME: user
      SPRING_DATASOURCE_PASSWORD: welcome1
      GEOAPIFY_KEY: ${GEOAPIFY_KEY}
    depends_on:
      - public-transport-db

  nginx:
    image: nginx:alpine
    container_name: nginx-proxy
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - public-transport-app

