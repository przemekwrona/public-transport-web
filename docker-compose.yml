name: public-transport

services:
  public-transport-db:
    image: postgres:18.6-alpine
    container_name: public-transport-db
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-public_transport_db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - ./data/public-transport-db:/var/lib/postgresql
      - ./docker/postgres/init-schemas.sql:/opt/init-schemas.sql:ro
    # $$ keeps the expansion in the container's shell instead of compose.
    # Schemas are created here so an existing data volume picks them up.
    # docker-entrypoint-initdb.d runs only on an empty data directory.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB} && psql -v ON_ERROR_STOP=1 -U $${POSTGRES_USER} -d $${POSTGRES_DB} -f /opt/init-schemas.sql"]
      interval: 5s
      timeout: 20s
      retries: 30
      start_period: 10s

  public-transport-app:
    # Dockerfile only copies target/public-transport-web-server-*.jar,
    # so `mvn clean package -DskipTests` in the repo root must run first.
    build:
      context: ./public-transport-web-server
      dockerfile: Dockerfile
    pull_policy: build
    # image: registry.digitalocean.com/public-transport-registry/public-transport-web:latest
    container_name: public-transport-app
    restart: unless-stopped
    ports:
      - "8084:8080"
    environment:
      PROFILE: ${PROFILE:-dev}
      JAVA_OPTS: -Xmx512m -Xms256m
      SPRING_DATASOURCE_URL: jdbc:postgresql://public-transport-db:5432/${POSTGRES_DB:-public_transport_db}?currentSchema=public_transport
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      GEOAPIFY_KEY: ${GEOAPIFY_KEY:-574fd7ffa3444cc2a614bdfb48e4ed99}
      LOGGING_FILE_NAME: /app/logs/public-transport-app.log
    volumes:
      - ./data/logs:/app/logs
    # Liquibase runs at startup, so Postgres has to accept connections first.
    depends_on:
      public-transport-db:
        condition: service_healthy
      keycloak:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
    security_opt:
      - no-new-privileges:true

  keycloak:
    image: quay.io/keycloak/keycloak:26.7.4
    container_name: keycloak
    restart: unless-stopped
    command: start-dev --import-realm
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://public-transport-db:5432/${POSTGRES_DB:-public_transport_db}
      KC_DB_USERNAME: ${POSTGRES_USER:-postgres}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      KC_DB_SCHEMA: keycloak
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      KC_HOSTNAME: http://localhost:8081
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HTTP_ENABLED: "true"
    volumes:
      - ./keycloak/import:/opt/keycloak/data/import
    ports:
      - "8081:8080"
    depends_on:
      public-transport-db:
        condition: service_healthy

