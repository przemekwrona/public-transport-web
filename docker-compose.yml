name: public-transport

services:
  public-transport-db:
    image: postgres:18.6-alpine
    container_name: public-transport-db
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-public_transport_db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - ./data/public-transport-db:/var/lib/postgresql
      - ./docker/postgres/init-schemas.sql:/docker-entrypoint-initdb.d/010-init-schemas.sql:ro
    # $$ keeps the expansion in the container's shell instead of compose.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s

  public-transport-app:
    # Dockerfile only copies target/public-transport-web-server-*.jar,
    # so `mvn clean package -DskipTests` in the repo root must run first.
    build:
      context: ./public-transport-web-server
      dockerfile: Dockerfile
    # image: registry.digitalocean.com/public-transport-registry/public-transport-web:latest
    container_name: public-transport-app
    restart: unless-stopped
    ports:
      - "8084:8080"
    environment:
      PROFILE: ${PROFILE:-dev}
      JAVA_OPTS: -Xmx512m -Xms256m
      SPRING_DATASOURCE_URL: jdbc:postgresql://public-transport-db:5432/${POSTGRES_DB:-public_transport_db}?currentSchema=public_transport
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      GEOAPIFY_KEY: ${GEOAPIFY_KEY:-}
      KEYCLOAK_ENABLED: "true"
      KEYCLOAK_SERVER_URL: http://keycloak:8080
      KEYCLOAK_ISSUER_URI: http://localhost:8081/realms/public-transport
      KEYCLOAK_JWK_SET_URI: http://keycloak:8080/realms/public-transport/protocol/openid-connect/certs
      KEYCLOAK_CLIENT_SECRET: ${KEYCLOAK_CLIENT_SECRET:-public-transport-web-secret}
      KEYCLOAK_PROVISIONING_CLIENT_SECRET: ${KEYCLOAK_PROVISIONING_CLIENT_SECRET:-public-transport-provisioning-secret}
    # Liquibase runs at startup, so Postgres has to accept connections first.
    # Keycloak must be ready so the resource server can read its signing keys.
    depends_on:
      public-transport-db:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
    security_opt:
      - no-new-privileges:true

  keycloak-db:
    image: postgres:18.6-alpine
    container_name: keycloak-db
    restart: unless-stopped
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: ${KEYCLOAK_DB:-keycloak}
      POSTGRES_USER: ${KEYCLOAK_DB_USER:-keycloak}
      POSTGRES_PASSWORD: ${KEYCLOAK_DB_PASSWORD:-keycloak}
    volumes:
      - ./data/keycloak-db:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s

  keycloak:
    image: quay.io/keycloak/keycloak:26.7.4
    container_name: keycloak
    restart: unless-stopped
    entrypoint: ["/bin/bash", "/opt/keycloak/ensure-provisioning-client.sh"]
    command: ["start-dev", "--import-realm"]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/${KEYCLOAK_DB:-keycloak}
      KC_DB_USERNAME: ${KEYCLOAK_DB_USER:-keycloak}
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:-keycloak}
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      KEYCLOAK_PROVISIONING_CLIENT_ID: public-transport-provisioning
      KEYCLOAK_PROVISIONING_CLIENT_SECRET: ${KEYCLOAK_PROVISIONING_CLIENT_SECRET:-public-transport-provisioning-secret}
      # Tokens advertise the host URL. The app container still calls Keycloak on the compose network.
      KC_HOSTNAME: http://localhost:8081
      KC_HOSTNAME_STRICT: "false"
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HTTP_ENABLED: "true"
      KC_HEALTH_ENABLED: "true"
    ports:
      - "8081:8080"
    volumes:
      - ./keycloak/import:/opt/keycloak/data/import:ro
    depends_on:
      keycloak-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/provisioning-client-ready && exec 3<>/dev/tcp/127.0.0.1/9000; echo -e 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3; cat <&3 | grep -q UP"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 40s

