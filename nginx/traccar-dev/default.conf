# 5000-5500 on TCP + UDP opens ~1000 listening sockets, each needs a worker connection
events {
    worker_connections 4096;
}

# Traccar web UI / API (port 8082)
http {
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    server {
        listen 8082;

        location / {
            proxy_pass http://traccar:8082;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 1h;
        }
    }
}

# GPS device protocol ports (5000-5500), TCP and UDP, forwarded to the same port on traccar
stream {
    resolver 127.0.0.11 valid=30s;

    server {
        listen 5000-5500;
        proxy_pass traccar:$server_port;
    }

    server {
        listen 5000-5500 udp;
        proxy_pass traccar:$server_port;
    }
}
