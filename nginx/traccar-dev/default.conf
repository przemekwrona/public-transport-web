map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# HTTP (port 80): Let's Encrypt challenge + redirect to HTTPS
server {
    listen 80;
    server_name dev.traccar.nastepnastacja.pl 46.101.207.75;

    # Let's Encrypt HTTP-01 challenge (also used for every renewal)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://dev.traccar.nastepnastacja.pl$request_uri;
    }
}

# HTTPS (port 443) -> Traccar web UI / API (traccar:8082)
server {
    listen 443 ssl;
    http2 on;
    server_name dev.traccar.nastepnastacja.pl;

    ssl_certificate     /etc/letsencrypt/live/dev.traccar.nastepnastacja.pl/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dev.traccar.nastepnastacja.pl/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    location / {
        proxy_pass http://traccar:8082;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 1h;
    }
}
