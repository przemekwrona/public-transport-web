# HTTP (port 80): Let's Encrypt challenge + redirect to HTTPS.
server {
    listen 80;
    server_name dev.nastepnastacja.pl www.dev.nastepnastacja.pl 165.227.133.71;

    # Let's Encrypt HTTP-01 challenge (also used for every renewal)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS (port 443)
server {
    listen 443 ssl;
    http2 on;
    server_name dev.nastepnastacja.pl www.dev.nastepnastacja.pl;

    ssl_certificate     /etc/letsencrypt/live/dev.nastepnastacja.pl/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dev.nastepnastacja.pl/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    location / {
        proxy_pass http://public-transport-app:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
